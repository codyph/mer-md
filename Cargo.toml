[package]
name = "mer-md"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
description = "Turn Markdown Mermaid diagrams into shareable SVGs, offline."
license = "MIT"
publish = false

[[bin]]
name = "mer-md"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
merman = { version = "=0.9.3", default-features = false, features = ["svg", "all-diagrams", "layout-cytoscape", "layout-elk"] }
pathdiff = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
roxmltree = "0.21"
regex = "1.0"
serde_json = "1.0"
sha2 = "0.10"
svgtypes = "0.16"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
